[project]
name = "relatorio-midiatico-isp"
version = "0.4.0"
description = "Relatório de Repercussão Midiática — ISP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "ddgs>=9,<10",
    "duckduckgo-search>=8,<9",
    "openai>=1.0,<3",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "pypdf>=5.0,<6",
    "reportlab>=4.0,<5",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
